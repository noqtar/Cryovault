name: FRAZIL q operands retry
on:
  push:
    paths: ['.github/workflows/frazil-qretry.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read q3 replies with socket timeout
        run: |
          python3 - <<'PY'
          import socket,time
          H,P='0.cloud.chals.io',18691
          for axis in range(2):
            for i in range(16):
              p=b'q'+(bytes([i,0,0,0]) if axis==0 else bytes([0,i,0,0]))
              try:
                with socket.create_connection((H,P),timeout=3) as s:
                  s.settimeout(1.0);s.sendall(p)
                  try:r=s.recv(64)
                  except socket.timeout:r=b''
                  print('axis',axis,'i',i,'response',r.hex(),flush=True)
              except Exception as e:print('error',axis,i,str(e),flush=True)
          PY