name: FRAZIL scan chunks
on:
  push:
    paths: ['.github/workflows/frazil-chunks.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Scan all bytes in separate connections
        run: |
          python3 - <<'PY'
          import socket,collections,time
          H,P='0.cloud.chals.io',18691
          for start in range(0,256,16):
            payload=bytes(range(start,start+16))
            try:
              with socket.create_connection((H,P),timeout=5) as s:
                s.settimeout(2);s.sendall(payload)
                raw=bytearray()
                while len(raw)<96:
                  try:q=s.recv(2048)
                  except socket.timeout:break
                  if not q:break
                  raw+=q
                print('SEG',start,'count',len(raw),'hex',raw.hex(),flush=True)
            except Exception as e:print('SEG',start,'ERROR',repr(e),flush=True)
          PY